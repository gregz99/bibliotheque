<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bibliothèque</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<style>
:root{
  --bg:#0b0d12;--bg2:#12151c;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);
  --ink:#f4f6fa;--ink2:#a7afbd;--ink3:#6c7586;--acc:#fbbf24;--acc2:#fb7185;--ok:#4ade80;--ko:#fb7185;--warn:#fbbf24;
  --glow:rgba(251,191,36,.13);--shadow:0 10px 30px rgba(0,0,0,.35)
}
@media (prefers-color-scheme:light){:root{
  --bg:#f6f4ef;--bg2:#fff;--card:rgba(255,255,255,.92);--card2:rgba(40,30,10,.06);--line:rgba(40,30,10,.1);
  --ink:#1a1710;--ink2:#58513f;--ink3:#948b73;--acc:#d97706;--acc2:#e11d48;--ok:#16a34a;--ko:#e11d48;--warn:#d97706;
  --glow:rgba(217,119,6,.12);--shadow:0 10px 30px rgba(40,30,10,.12)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--bg);min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 4px;max-width:560px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:-.02em}
.icon{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);font-size:18px}
main{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat small{color:var(--ink3);font-size:11px}
.quick{display:flex;gap:8px}
input,textarea{flex:1;min-width:0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}
input{height:48px}textarea{padding:12px 14px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.add{height:48px;padding:0 18px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0d02;font-weight:700;white-space:nowrap}
.add.sq{width:48px;padding:0;font-size:22px;background:var(--card2);color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;animation:rise .3s ease both;text-align:left;width:100%}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.item .m{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .c{color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.stars{display:inline-flex;gap:1px;font-size:14px;letter-spacing:0;color:var(--card2);line-height:1}
.stars .f{color:var(--acc)}.stars .h{background:linear-gradient(90deg,var(--acc) 50%,var(--card2) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px}
.b-termine{background:rgba(74,222,128,.15);color:var(--ok)}.b-en_cours{background:rgba(251,191,36,.16);color:var(--warn)}.b-a_faire{background:var(--card2);color:var(--ink2)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--ink2)}
.play{min-height:34px;padding:0 12px;border-radius:99px;background:var(--card2);color:var(--ink);font-size:12px;font-weight:700}
.play:active{transform:scale(.95)}
.empty{text-align:center;color:var(--ink3);padding:36px 20px}
.empty .e{font-size:40px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;color:var(--ink3);font-size:11px;font-weight:600}
nav button span{font-size:20px;line-height:1}
nav button.on{background:var(--card2);color:var(--ink)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);z-index:21;max-height:90vh;overflow:auto}
#sheet.on{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
#sheet h3{margin:0 0 14px;font-size:18px;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--ink3);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:14px;background:var(--card2)}
.seg button{height:40px;border-radius:11px;color:var(--ink2);font-weight:600;font-size:13px}
.seg button.on{background:var(--bg2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.big-stars{display:flex;gap:6px;font-size:34px;line-height:1}
.big-stars button{position:relative;width:38px;height:38px;color:var(--card2);font-size:34px;line-height:1}
.big-stars button.f{color:var(--acc)}
.big-stars button.h{background:linear-gradient(90deg,var(--acc) 50%,var(--card2) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.row2{display:flex;gap:10px;margin-top:6px}
.danger{height:48px;padding:0 16px;border-radius:14px;background:var(--card2);color:var(--ko);font-weight:700}
.menu button{width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--line);font-weight:500}
.menu button:first-of-type{border-top:0}
#toast{position:fixed;left:50%;width:max-content;max-width:calc(100vw - 32px);bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-weight:500;font-size:14px;transition:.25s;z-index:30;pointer-events:none;box-shadow:var(--shadow)}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{color:var(--acc2);font-weight:700}
.muted{color:var(--ink3);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1 id="h1">Bibliothèque</h1><button class="icon" data-act="menu" aria-label="Menu">⋯</button></header>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<div id="scrim" data-act="close"></div><div id="sheet" role="dialog" aria-modal="true"></div><div id="toast"></div>
<input id="file" type="file" accept="application/json" hidden>
<script>
const KEY = 'bibliotheque-v1'
const $ = s => document.querySelector(s)
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()))
const pad = n => String(n).padStart(2, '0')
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')

const TABS = [
  { id: 'livre', icon: '📖', label: 'Livres', add: 'Ajouter un livre lu…', done: 'Lu', one: 'livre', emoji: '📚', hint: 'Ajoute ton premier livre ci-dessus.' },
  { id: 'film', icon: '🎬', label: 'Films', add: 'Ajouter un film vu…', done: 'Vu', one: 'film', emoji: '🍿', hint: 'Ajoute ton premier film ci-dessus.' },
  { id: 'musique', icon: '🎧', label: 'Écoutes', add: 'Ajouter une musique écoutée…', done: 'Écouté', one: 'musique', emoji: '🎶', hint: 'Albums, morceaux… ajoute ce que tu écoutes.' },
  { id: 'morceaux', icon: '🎹', label: 'Joués', add: 'Morceau joué aujourd’hui…', emoji: '🎼', hint: 'Note les morceaux que tu joues.' },
]
const STATUSES = ['a_faire', 'en_cours', 'termine']
const INSTRUMENTS = ['piano', 'guitare', 'chant']
const tab = () => TABS.find(t => t.id === ui.tab)
const statusLabel = (k, s) => s === 'a_faire' ? 'À faire' : s === 'en_cours' ? 'En cours' : TABS.find(t => t.id === k).done

let db
try { db = JSON.parse(localStorage.getItem(KEY)) } catch {}
if (!db || !Array.isArray(db.media)) db = { media: [], sessions: [] }
db.sessions = db.sessions || []
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)) } catch {} }
const ui = { tab: 'livre', q: '', status: 'tous', sort: 'recent', inst: 'tous', sheet: null }

// ---------- calculs ----------
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h }
const avatar = s => `<div class="av" style="background:linear-gradient(135deg,hsl(${hue(s)} 62% 48%),hsl(${(hue(s) + 40) % 360} 62% 38%))">${esc((String(s).trim()[0] || '?').toUpperCase())}</div>`
const stars = r => `<span class="stars" aria-label="${r == null ? 'pas de note' : r + ' sur 10'}">${[1, 2, 3, 4, 5].map(i => `<span class="${r != null && r >= 2 * i ? 'f' : r != null && r === 2 * i - 1 ? 'h' : ''}">★</span>`).join('')}</span>`
function average(items) {
  const r = items.map(i => i.rating).filter(n => typeof n === 'number')
  return r.length ? Math.round(r.reduce((a, b) => a + b, 0) / r.length * 10) / 10 : null
}
function playedPieces() {
  const map = new Map()
  for (const s of db.sessions) {
    const piece = (s.piece || '').trim(); if (!piece) continue
    const key = piece.toLowerCase() + '|' + s.instrument.toLowerCase(), cur = map.get(key)
    if (!cur) map.set(key, { piece, instrument: s.instrument, times: 1, last: s.date })
    else { cur.times++; if (s.date > cur.last) cur.last = s.date }
  }
  return [...map.values()].sort((a, b) => a.last < b.last ? 1 : a.last > b.last ? -1 : a.piece.localeCompare(b.piece))
}

// ---------- actions ----------
let toastTimer
function toast(msg, undo) {
  const t = $('#toast')
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Annuler</button>' : ''}`
  t.classList.add('on'); toast.undo = undo
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 4500)
}
function mutate(fn, msg) {
  const before = JSON.stringify(db)
  fn(); persist()
  if (msg) toast(msg, () => { db = JSON.parse(before); persist(); render() })
  render()
}
const playToday = (piece, instrument) => mutate(() => {
  const date = todayStr(), cur = db.sessions.find(s => s.date === date && s.instrument.toLowerCase() === instrument.toLowerCase())
  if (cur) cur.piece = piece; else db.sessions.push({ id: uid(), date, instrument, piece })
}, `« ${piece} » noté aujourd’hui`)

// ---------- rendu ----------
function render() {
  const t = tab()
  $('#h1').textContent = t.id === 'morceaux' ? 'Morceaux joués' : t.label
  $('#nav').innerHTML = TABS.map(x => {
    const n = x.id === 'morceaux' ? playedPieces().length : db.media.filter(m => m.type === x.id && m.status === 'termine').length
    return `<button class="${ui.tab === x.id ? 'on' : ''}" data-act="tab" data-v="${x.id}"><span>${x.icon}</span>${x.label}${n ? ` · ${n}` : ''}</button>`
  }).join('')
  $('#app').innerHTML = t.id === 'morceaux' ? renderPieces() : renderMedia(t)
  renderSheet()
}
function renderMedia(t) {
  const all = db.media.filter(m => m.type === t.id), done = all.filter(m => m.status === 'termine')
  const year = String(new Date().getFullYear()), thisYear = done.filter(m => (m.created || '').startsWith(year)).length, avg = average(done)
  let list = all.filter(m => (ui.status === 'tous' || m.status === ui.status) && (!ui.q.trim() || norm(m.title).includes(norm(ui.q.trim())) || norm(m.comment).includes(norm(ui.q.trim()))))
  list = [...list].sort(ui.sort === 'note' ? (a, b) => (b.rating ?? -1) - (a.rating ?? -1) : ui.sort === 'az' ? (a, b) => a.title.localeCompare(b.title) : (a, b) => (b.created || '').localeCompare(a.created || ''))
  return `
  <div class="stats"><div class="stat"><b>${done.length}</b><small>${t.done.toLowerCase()}${done.length > 1 ? 's' : ''}</small></div>
    <div class="stat"><b>${avg != null ? avg : '–'}</b><small>note moy. /10</small></div><div class="stat"><b>${thisYear}</b><small>en ${year}</small></div></div>
  <form class="quick" id="f-quick"><input name="title" placeholder="${t.add}" autocomplete="off" enterkeyhint="done"><button class="add">Ajouter</button><button type="button" class="add sq" data-act="new" aria-label="Plus d’options">⋯</button></form>
  ${all.length > 4 ? `<input id="q" value="${esc(ui.q)}" placeholder="Rechercher…" autocomplete="off" style="flex:none;width:100%">` : ''}
  <div class="chips">${[['tous', 'Tous'], ['a_faire', 'À faire'], ['en_cours', 'En cours'], ['termine', t.done + 's']].map(([v, l]) => `<button class="chip ${ui.status === v ? 'on' : ''}" data-act="status" data-v="${v}">${l}</button>`).join('')}
    <span style="flex:1"></span>${[['recent', 'Récents'], ['note', 'Mieux notés'], ['az', 'A–Z']].map(([v, l]) => `<button class="chip ${ui.sort === v ? 'on' : ''}" data-act="sort" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="list">${list.length ? list.map(m => `<button class="item" data-act="edit" data-id="${m.id}">${avatar(m.title)}
    <div class="m"><div class="t">${esc(m.title)}</div><div class="c">${m.comment ? esc(m.comment) : '<span style="opacity:.6">Touche pour noter</span>'}</div></div>
    <div class="r">${stars(m.rating)}<span class="badge b-${m.status}" data-act="cycle" data-id="${m.id}">${statusLabel(m.type, m.status)}</span></div></button>`).join('')
    : `<div class="empty"><div class="e">${t.emoji}</div>${all.length ? 'Aucun résultat avec ce filtre.' : t.hint}</div>`}</div>`
}
function renderPieces() {
  const all = playedPieces(), list = all.filter(p => ui.inst === 'tous' || p.instrument.toLowerCase() === ui.inst)
  const insts = [...new Set([...INSTRUMENTS, ...all.map(p => p.instrument.toLowerCase())])]
  const today = todayStr(), n = db.sessions.filter(s => s.piece).length
  return `
  <div class="stats"><div class="stat"><b>${all.length}</b><small>morceaux</small></div><div class="stat"><b>${n}</b><small>séances</small></div>
    <div class="stat"><b>${db.sessions.filter(s => s.date.slice(0, 7) === today.slice(0, 7) && s.piece).length}</b><small>ce mois-ci</small></div></div>
  <form class="quick" id="f-piece"><input name="piece" placeholder="Morceau joué aujourd’hui…" autocomplete="off" enterkeyhint="done"><button class="add">Ajouter</button></form>
  <div class="chips">${['tous', ...insts].map(i => `<button class="chip ${ui.inst === i ? 'on' : ''}" data-act="inst" data-v="${i}">${i === 'tous' ? 'Tous' : i[0].toUpperCase() + i.slice(1)}</button>`).join('')}</div>
  <div class="list">${list.length ? list.map(p => {
    const doneToday = db.sessions.some(s => s.date === today && s.instrument.toLowerCase() === p.instrument.toLowerCase() && (s.piece || '').toLowerCase() === p.piece.toLowerCase())
    return `<div class="item">${avatar(p.piece)}<div class="m"><div class="t">${esc(p.piece)}</div>
    <div class="c">${p.times} séance${p.times > 1 ? 's' : ''} · dernière : ${new Date(p.last + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</div></div>
    <div class="r"><span class="tag">${esc(p.instrument)}</span>${doneToday ? '<span class="badge b-termine">Joué ✓</span>' : `<button class="play" data-act="play" data-piece="${esc(p.piece)}" data-inst="${esc(p.instrument)}">+ Joué aujourd’hui</button>`}</div></div>`
  }).join('') : `<div class="empty"><div class="e">🎼</div>${all.length ? 'Aucun morceau pour cet instrument.' : 'Note les morceaux que tu joues.'}</div>`}</div>
  <p class="muted">Un seul morceau par instrument et par jour.</p>`
}

// ---------- feuille ----------
function openSheet(s) { ui.sheet = s; renderSheet() }
function closeSheet() { ui.sheet = null; renderSheet() }
function starsPicker(r) {
  return `<div class="big-stars" id="bs">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="${r != null && r >= 2 * i ? 'f' : r != null && r === 2 * i - 1 ? 'h' : ''}" data-act="rate" data-i="${i}" aria-label="${i} étoiles">★</button>`).join('')}</div>
    <p class="muted" style="text-align:left;margin:6px 0 0">${r != null ? `${r}/10 · touche la moitié gauche d’une étoile pour une demi-note · ` : ''}<button type="button" data-act="rate" data-i="0" style="color:var(--acc);font-weight:600">${r != null ? 'Effacer' : 'Pas de note'}</button></p>`
}
function renderSheet() {
  const s = ui.sheet, sh = $('#sheet')
  $('#scrim').classList.toggle('on', !!s); sh.classList.toggle('on', !!s)
  if (!s) return
  let h = '<div class="grab"></div>'
  if (s.type === 'edit' || s.type === 'new') {
    const t = tab(), m = s.draft
    h += `<h3>${s.type === 'new' ? 'Nouveau ' + t.one : 'Modifier'}</h3><form id="f-edit">
      <div class="field"><label>Titre</label><input name="title" value="${esc(m.title)}" required autocomplete="off"></div>
      <div class="field"><label>Statut</label><div class="seg">${STATUSES.map(x => `<button type="button" class="${m.status === x ? 'on' : ''}" data-act="setstatus" data-v="${x}">${statusLabel(t.id, x)}</button>`).join('')}</div></div>
      <div class="field"><label>Note</label>${starsPicker(m.rating)}</div>
      <div class="field"><label>Commentaire</label><textarea name="comment" placeholder="Ce que tu en as pensé…">${esc(m.comment || '')}</textarea></div>
      <div class="row2"><button class="add" style="flex:1">Enregistrer</button>${s.type === 'edit' ? '<button type="button" class="danger" data-act="del">Supprimer</button>' : ''}</div></form>`
  } else if (s.type === 'menu') {
    h += `<h3>Menu</h3><div class="menu"><button data-act="export">Exporter mes données</button><button data-act="import">Importer un fichier</button><button style="color:var(--ko)" data-act="reset">Tout effacer</button></div>
      <p class="muted" style="text-align:left;margin-top:10px">Les données restent sur cet appareil.</p>`
  }
  sh.innerHTML = h
}
function readDraft() { // garde ce qui est tapé quand on touche les étoiles / le statut
  const f = $('#f-edit'); if (!f) return
  ui.sheet.draft.title = f.title.value; ui.sheet.draft.comment = f.comment.value
}

// ---------- événements ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return
  const { act, id, v } = t.dataset
  const m = id && db.media.find(x => x.id === id)
  switch (act) {
    case 'tab': ui.tab = v; ui.q = ''; ui.status = 'tous'; render(); scrollTo(0, 0); break
    case 'status': ui.status = v; render(); break
    case 'sort': ui.sort = v; render(); break
    case 'inst': ui.inst = v; render(); break
    case 'cycle': e.stopPropagation(); mutate(() => { m.status = STATUSES[(STATUSES.indexOf(m.status) + 1) % 3] }); break
    case 'edit': openSheet({ type: 'edit', id, draft: { ...m } }); break
    case 'new': { const f = $('#f-quick'); openSheet({ type: 'new', draft: { title: f ? f.title.value : '', status: 'termine', rating: null, comment: '' } }); break }
    case 'setstatus': readDraft(); ui.sheet.draft.status = v; renderSheet(); break
    case 'rate': {
      readDraft(); const i = Number(t.dataset.i), r = t.getBoundingClientRect()
      ui.sheet.draft.rating = i === 0 ? null : (e.clientX - r.left < r.width / 2 ? 2 * i - 1 : 2 * i)
      renderSheet(); break
    }
    case 'del': { const title = m ? m.title : db.media.find(x => x.id === ui.sheet.id).title; const sid = ui.sheet.id; closeSheet(); mutate(() => { db.media = db.media.filter(x => x.id !== sid) }, `« ${title} » supprimé`); break }
    case 'play': playToday(t.dataset.piece, t.dataset.inst); break
    case 'menu': openSheet({ type: 'menu' }); break
    case 'close': closeSheet(); break
    case 'undo': toast.undo && toast.undo(); $('#toast').classList.remove('on'); break
    case 'export': { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })); a.download = `bibliotheque-${todayStr()}.json`; a.click(); break }
    case 'import': $('#file').click(); break
    case 'reset': if (confirm('Effacer toutes les données de cette appli ?')) { db = { media: [], sessions: [] }; persist(); closeSheet(); render() } break
  }
})
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; render(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }
})
document.addEventListener('submit', e => {
  e.preventDefault()
  const f = new FormData(e.target)
  if (e.target.id === 'f-quick') {
    const title = String(f.get('title') || '').trim(); if (!title) return
    mutate(() => db.media.push({ id: uid(), type: ui.tab, title, status: 'termine', rating: null, comment: null, created: new Date().toISOString() }), `« ${title} » ajouté`)
  } else if (e.target.id === 'f-piece') {
    const piece = String(f.get('piece') || '').trim(); if (!piece) return
    playToday(piece, ui.inst !== 'tous' ? ui.inst : 'piano')
  } else if (e.target.id === 'f-edit') {
    const d = ui.sheet.draft, title = String(f.get('title') || '').trim(); if (!title) return
    d.title = title; d.comment = String(f.get('comment') || '').trim() || null
    if (ui.sheet.type === 'new') mutate(() => db.media.push({ id: uid(), type: ui.tab, title, status: d.status, rating: d.rating, comment: d.comment, created: new Date().toISOString() }))
    else mutate(() => Object.assign(db.media.find(x => x.id === ui.sheet.id), { title, status: d.status, rating: d.rating, comment: d.comment }))
    closeSheet()
  }
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet() })
$('#file').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text())
    if (!Array.isArray(d.media) || !Array.isArray(d.sessions)) throw 0
    if (confirm('Remplacer les données actuelles par ce fichier ?')) { db = d; persist(); closeSheet(); render() }
  } catch { alert('Fichier invalide') }
  e.target.value = ''
}
render()
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
